name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New Version Name (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      version_code:
        description: 'New Version Code (e.g. 2)'
        required: true
        default: '2'
      target_branch:
        description: 'Target branch to apply version bump (e.g. develop or active PR branch)'
        required: true
        default: 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    name: Bump Version on Target Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update Version in app/build.gradle.kts
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" app/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "${{ github.event.inputs.version_name }}"/' app/build.gradle.kts

      - name: Update Version in wear/build.gradle.kts
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" wear/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "${{ github.event.inputs.version_name }}"/' wear/build.gradle.kts

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts wear/build.gradle.kts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): bump version to ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})"
            git push origin ${{ github.event.inputs.target_branch }}
          fi
