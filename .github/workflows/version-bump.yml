name: Version Bump (Create PR)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New Version Name (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      version_code:
        description: 'New Version Code (e.g. 2)'
        required: true
        default: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update Version in app/build.gradle.kts
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" app/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "${{ github.event.inputs.version_name }}"/' app/build.gradle.kts

      - name: Update Version in wear/build.gradle.kts
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" wear/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "${{ github.event.inputs.version_name }}"/' wear/build.gradle.kts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): bump version to ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})"
          branch: "release/v${{ github.event.inputs.version_name }}"
          delete-branch: true
          title: "Release v${{ github.event.inputs.version_name }}"
          body: |
            Automated version bump to ${{ github.event.inputs.version_name }} (Code: ${{ github.event.inputs.version_code }}).

            This PR was generated automatically by the `version-bump` workflow.
            Once merged, a tag will be created automatically.
          base: master
          labels: |
            release
            automated
