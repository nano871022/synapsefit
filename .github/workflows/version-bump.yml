name: Version Bump & Release Tag

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New Version Name (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      version_code:
        description: 'New Version Code (e.g. 2)'
        required: true
        default: '2'

jobs:
  version-bump:
    name: Bump Version & Create Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update Version in app/build.gradle.kts
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" app/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "${{ github.event.inputs.version_name }}"/' app/build.gradle.kts

      - name: Update Version in wear/build.gradle.kts
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" wear/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "${{ github.event.inputs.version_name }}"/' wear/build.gradle.kts

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push Changes
        run: |
          git add app/build.gradle.kts wear/build.gradle.kts
          git commit -m "chore(release): bump version to ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})"
          git push origin ${{ github.ref_name }}

      - name: Create and Push Git Tag
        run: |
          TAG_NAME="v${{ github.event.inputs.version_name }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
