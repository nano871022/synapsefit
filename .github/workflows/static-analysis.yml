name: Static Analysis

on:
  workflow_call:
    outputs:
      error_log:
        description: "Static analysis error log"
        value: ${{ jobs.static-analysis.outputs.error_log }}

jobs:
  static-analysis:
    name: Code Formatting & Static Analysis Check
    runs-on: ubuntu-latest
    outputs:
      error_log: ${{ steps.error_log.outputs.log_content }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout japl about module
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-android-about-module
          path: about

      - name: Create local.properties
        run: |
          echo "about.path=about" >> local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Ktlint & Detekt
        id: run_lint
        run: |
          set -o pipefail
          ./gradlew ktlintCheck detekt -x :about:ktlintCheck -x :about:detekt 2>&1 | tee build_errors.log

      - name: Read Error Log
        if: failure()
        id: error_log
        run: |
          if [ -f build_errors.log ]; then
            ERROR_CONTENT=$(tail -n 50 build_errors.log)
          else
            ERROR_CONTENT="No build_errors.log file found."
          fi
          echo "log_content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ERROR_CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload Static Analysis Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/detekt/
          if-no-files-found: warn
