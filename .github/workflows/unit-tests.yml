name: Unit Tests

on:
  workflow_call:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Properties
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-properties
          token: ${{ secrets.TOKEN_PROP_GITHUB || secrets.GH_TOKEN || github.token }}
          path: properties

      - name: Checkout japl about module
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-android-about-module
          path: about

      - name: Create local.properties
        run: |
          echo "about.path=about" >> local.properties
          echo "google.services.path=properties/synapseefit/google-services.json" >> local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        id: run_tests
        run: |
          set -o pipefail
          ./gradlew :core:test \
                    :util:test \
                    :services:feature:test \
                    :services:repository:test \
                    :services:gcp:test \
                    :services:llm:test \
                    :services:wear:test \
                    :ui:test \
                    :wear:test \
                    :app:testDebugUnitTest 2>&1 | tee build_errors.log

      - name: Read Error Log
        if: failure()
        id: error_log
        run: |
          ERROR_CONTENT=$(tail -n 50 build_errors.log)
          echo "log_content<<EOF" >> $GITHUB_ENV
          echo "$ERROR_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Request Jules Fix
        if: failure()
        uses: google-labs-code/jules-invoke@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The CI pipeline failed during the lint/test phase.
            Please analyze the following error logs and apply a fix to the repository:
            ${{ env.log_content }}

      - name: Upload Unit Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
