name: Unit Tests

on:
  workflow_call:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: |
          ./gradlew :core:test \
                    :util:test \
                    :services:feature:test \
                    :services:repository:test \
                    :services:gcp:test \
                    :services:llm:test \
                    :services:wear:test \
                    :ui:test \
                    :wear:test \
                    :app:testDebugUnitTest
