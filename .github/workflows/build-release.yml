name: Build Release

on:
  workflow_call:

jobs:
  build-release:
    name: Build Signed Release Bundles
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Properties
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-properties
          token: ${{ secrets.TOKEN_PROP_GITHUB || secrets.GH_TOKEN || github.token }}
          path: properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release Bundles & APKs
        run: |
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/properties/synapseefit/firm-app.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.FIRM_APP_PWD }} \
            -Pandroid.injected.signing.key.alias=synapsefit \
            -Pandroid.injected.signing.key.password=${{ secrets.FIRM_APP_PWD }}

      - name: Upload Mobile Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload Mobile Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Wear OS Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-wear-release-bundle
          path: wear/build/outputs/bundle/release/wear-release.aab
          if-no-files-found: warn

      - name: Upload Wear OS Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-wear-release-apk
          path: wear/build/outputs/apk/release/wear-release.apk
          if-no-files-found: warn
