name: CI & QA Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Code Formatting & Static Analysis Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run Ktlint & Detekt
        run: ./gradlew ktlintCheck detekt

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew :core:test :util:test :services:feature:test :services:repository:test :services:gcp:test :services:llm:test :services:wear:test :ui:test :wear:test :app:testDebugUnitTest --parallel --build-cache

  build-apks:
    name: Build Debug APK Artifacts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APKs
        run: ./gradlew assembleDebug

      - name: Upload Mobile Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Wear OS Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: warn
