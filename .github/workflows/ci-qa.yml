name: CI & QA Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Code Formatting & Static Analysis Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run Ktlint & Detekt
        run: ./gradlew ktlintCheck detekt

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew :core:test :util:test :services:feature:test :services:repository:test :services:gcp:test :services:llm:test :services:wear:test :ui:test :wear:test :app:testDebugUnitTest --parallel --build-cache

  build-release:
    name: Build Signed Release Bundles
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: PROD
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Properties
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-properties
          token: ${{ secrets.TOKEN_PROP_GITHUB }}
          path: properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release Bundles & APKs
        run: |
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/properties/synapseefit/firm-app.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.FIRM_APP_PWD }} \
            -Pandroid.injected.signing.key.alias=synapsefit \
            -Pandroid.injected.signing.key.password=${{ secrets.FIRM_APP_PWD }}

      - name: Upload Mobile Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload Mobile Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Wear OS Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-wear-release-bundle
          path: wear/build/outputs/bundle/release/wear-release.aab
          if-no-files-found: warn

      - name: Upload Wear OS Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsefit-wear-release-apk
          path: wear/build/outputs/apk/release/wear-release.apk
          if-no-files-found: warn
